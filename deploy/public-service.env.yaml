# Environment for the PUBLIC connector service (`vanna-mcp-solana-public`, project solana-mcp). Used with
#   gcloud run deploy vanna-mcp-solana-public --env-vars-file=deploy/public-service.env.yaml ...
# See docs/DEPLOY_PUBLIC.md. The signing key is NOT here: it is mounted from Secret Manager.
# The Copilot's private service (`vanna-mcp-solana`) is a separate service and never gets these settings.
PUBLIC_MODE: "true"
AUTH_ENABLED: "true"
# The service's own https URL: the OAuth issuer, the token audience base and the origin of the sign-in and plan pages.
# The custom domain (mapped 2026-11-11), as the Stellar MCP is on mcp.vanna.finance; docs/DEPLOY_PUBLIC.md "Custom domain".
# Cloud Run's own URL still answers, but this is the issuer. Changing it makes every client sign in again once.
# Not in this file (kept out of git): APP_ACCESS_CODE, and the secrets OAUTH_SIGNING_KEY_PEM, TITAN_API_KEY, PLAN_PROXY_SECRET.
EXTERNAL_BASE_URL: "https://mcp.solana.vanna.finance"
# Shared state across instances (logins, refresh tokens, plans, spend counters, rate limits).
STATE_STORE: "firestore"
FIRESTORE_PROJECT: "solana-mcp"
FIRESTORE_COLLECTION: "mcp_state"
SAFETY_LAYER: "true"
# Test fork (staging). Test funds: `vanna_wallet action=faucet` (fork only, capped per wallet per day).
ENABLE_TEST_FAUCET: "true"
SOLANA_RPC_URL: "https://rpc-devnet.solana.vanna.finance"
SOLANA_WS_URL: "wss://rpc-devnet.solana.vanna.finance"
SOLANA_CLUSTER_LABEL: "surfpool-fork"
VANNA_PROGRAM_ID: "H37YVBG3eGtz89ofd7iDLc2PJgn12778392XeU2QJcGC"
ORACLE_MODE: "dev-fork"
PRICE_REFRESH_SOURCE: "keeper"
PRICE_KEEPER_URL: "https://test.solana.vanna.finance"
PROTOCOL_LOOKUP_TABLES: "zEEeoScWGrV1YeVzyUGar6S6KKiWcBLxeuYdwjoX5fg"
# Sign-in and plan approvals stay on this service's own pages, as on the Stellar MCP (empty = /plan/<id> here, not the
# website's approve page).
APPROVE_PAGE_URL: ""
# Email / Google / X / GitHub sign-in on those pages: the website's Dynamic environment (its NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID,
# a public value), so the same login opens the same Solana wallet. The service's address must be an allowed origin in
# that Dynamic environment (dashboard → Security → Allowed origins).
DYNAMIC_ENVIRONMENT_ID: "90dad26e-c7b1-4047-857e-ab4ad5596f9a"
# Cloud Run direct: one trusted proxy hop for the client IP.
TRUSTED_PROXY_HOPS: "1"
LOG_LEVEL: "INFO"
