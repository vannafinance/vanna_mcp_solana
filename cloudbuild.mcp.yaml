# Build -> push -> deploy the Vanna Solana MCP server to Cloud Run.
#
#   gcloud builds submit . --project=solana-mcp --region=us-central1 \
#     --config=cloudbuild.mcp.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# Hosted in GCP project solana-mcp, region us-central1, Artifact Registry
# vanna-credit, service vanna-mcp-solana. Ingress is all, but Cloud Run IAM must stay
# REQUIRED: only the app's runtime SA in vanna-credit-solana-test is run.invoker, and
# the MCP checks the WorkOS token. Never add an allUsers invoker. (ingress=internal
# does not work across projects: the caller gets a 404.) See COPILOT_ARCHITECTURE.md §11.
# The Cloud Build service account needs storage.objectViewer, artifactregistry.writer,
# logging.logWriter (and run.admin + iam.serviceAccountUser for the deploy step below);
# the first hosted build used a build-only config with --service-account instead.
#
# Runtime configuration (AUTH_ENABLED, OAUTH_*, EXTERNAL_BASE_URL, SOLANA_RPC_URL,
# JUPITER_API_KEY, ...) lives on the Cloud Run service, not here: `gcloud run
# deploy --image` keeps the service's existing env vars and secret mounts. Set
# them with `gcloud run services update --update-env-vars=...`. The first deploy
# must set AUTH_ENABLED=true and the OAUTH_* vars (WorkOS M2M).

substitutions:
  _REGION: us-central1
  _REPO: vanna-credit
  _IMAGE_NAME: mcp-solana
  _SERVICE: vanna-mcp-solana
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --ingress=all
      - --no-allow-unauthenticated
      # MCP sessions (mcp-session-id) live in instance memory. Affinity keeps a client on its instance;
      # if it still lands elsewhere the server answers 404 and the Copilot client re-handshakes.
      - --session-affinity
      - --min-instances=1
      - --timeout=300
      - --quiet
