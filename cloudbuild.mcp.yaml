# Build -> push -> deploy the Vanna Solana MCP server to Cloud Run.
#
#   gcloud builds submit . --project=<PROJECT> --region=us-central1 \
#     --config=cloudbuild.mcp.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# Runtime configuration (AUTH_ENABLED, OAUTH_*, EXTERNAL_BASE_URL, SOLANA_RPC_URL,
# JUPITER_API_KEY, ...) lives on the Cloud Run service, not here: `gcloud run
# deploy --image` keeps the service's existing env vars and secret mounts. Set
# them with `gcloud run services update --update-env-vars=...`; include TRUSTED_PROXY_HOPS=1
# (Cloud Run's front end appends the client IP to X-Forwarded-For). The first deploy
# of a public service must set AUTH_ENABLED=true and the OAUTH_* vars.
#
# Project, service and repository names are placeholders until the owner picks
# where the MCP is hosted.

substitutions:
  _REGION: us-central1
  _REPO: vanna-credit
  _IMAGE_NAME: mcp-solana
  _SERVICE: vanna-mcp-solana
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      # MCP sessions (mcp-session-id) live in instance memory. Affinity keeps a client on its instance;
      # if it still lands elsewhere the server answers 404 and the Copilot client re-handshakes.
      - --session-affinity
      - --min-instances=1
      - --timeout=300
      - --quiet
